<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Web3 Gateway Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Status bar -->
    <div id="statusBar" class="status-inactive">
      <span id="statusIcon">⊙</span>
      <span id="statusText">Waiting for gateway page...</span>
      <span id="statusTime" class="status-time"></span>
    </div>

    <!-- Structured capture info: status / coverage / body / missing -->
    <div id="captureInfo" class="capture-info hidden">
      <div class="info-row">
        <span class="info-label">Capture Status</span>
        <span class="info-value" id="infoStatus">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Resource Coverage</span>
        <span class="info-value" id="infoCoverage">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Body Availability</span>
        <span class="info-value" id="infoBody">—</span>
      </div>
      <div class="info-row info-row-missing hidden" id="infoMissingRow">
        <span class="info-label">Missing Resources</span>
        <span class="info-value" id="infoMissing">0</span>
      </div>
    </div>

    <!-- Summary: file count + total size + actions -->
    <div id="summary" class="hidden">
      <div class="summary-grid">
        <div class="summary-item">
          <span class="summary-value" id="sumTotal">0</span>
          <span class="summary-label">Files</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="sumSize">0 B</span>
          <span class="summary-label">Total Size</span>
        </div>
        <div class="summary-item hidden" id="sumMissedItem">
          <span class="summary-value missed-value" id="sumMissed">0</span>
          <span class="summary-label">Missed</span>
        </div>
      </div>
      <div class="actions">
        <button id="btnToggle" class="btn btn-primary btn-sm">Show Files</button>
      </div>
    </div>

    <!-- File list (collapsed by default) -->
    <div id="results" class="hidden">
      <div id="resultsList" class="results-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
